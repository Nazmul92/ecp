[project]
name = "ecp-runtime"
dynamic = ["version"]      # single-sourced from ecp/version.py
description = "A post-tool verification runtime for agentic systems: verified claims, recomputable calculations, provenance-carrying answers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []          # stdlib only by design; adapters import lazily
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
langgraph = ["langgraph"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "ecp.version.__version__" }

[tool.setuptools.packages.find]
include = ["ecp*"]

[tool.setuptools.package-data]
ecp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Deliberately narrow: this catches bugs (undefined names, unused imports,
# mutable default args, shadowed loop vars), not style. The codebase uses a
# compact one-line-per-assertion test idiom and `Optional[...]` for 3.10
# readability; linting those into submission would be churn, not quality.
[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = [
    "B011",   # `assert False` is this suite's "should have raised" idiom
    "B008",   # function call in default arg: not used unsafely here
]
